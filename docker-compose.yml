services:
  frontend:
    build:
      context: ./frontend
    container_name: frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    networks:
      - stockolm-net

  backend:
    build:
      context: ./backend
    container_name: backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    # volumes:
    #   - ./backend:/app
    environment:
      ENV: docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stockolm-net

  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stockolm-net

  nginx:
    build:
      context: ./nginx
    container_name: nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    restart: always
    networks:
      - stockolm-net

networks:
  stockolm-net:
    driver: bridge

volumes:
  postgres-data: